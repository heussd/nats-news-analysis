services:
    nats-server:
        image: docker.io/nats:2.15
        restart: always
        ports:
            - '4222:4222' # 4222 is for clients.
            - '8222:8222' # 8222 is an HTTP management port for information reporting.
            - '6222:6222' # 6222 is a routing port for clustering.
        volumes:
            - './nats-persistence/:/data'
        command: '--jetstream --http_port 8222 --store_dir /data'
    defuddle:
        image: ghcr.io/heussd/defuddle-server
        deploy:
            replicas: 2
        environment:
            ALLOW_PRIVATE_NETWORKS: "false"
        restart: always
    feed-feeder:
        image: ghcr.io/heussd/nats-news-analysis/feed-feeder:latest
        restart: always
        depends_on:
            - nats-server
        environment:
            - NATS_URL=nats://nats-server:4222
            - URLS_URL=${URLS_URL}
    article-feeder:
        image: ghcr.io/heussd/nats-news-analysis/article-feeder:latest
        restart: always
        depends_on:
            - nats-server
        deploy:
            replicas: 3
        environment:
            - NATS_URL=nats-server:4222
    news-feeder:
        image: ghcr.io/heussd/nats-news-analysis/news-feeder:latest
        restart: always
        depends_on:
            - nats-server
        deploy:
            replicas: 2
        environment:
            - NATS_URL=nats-server:4222
            - DEFUDDLE_SERVER=http://loadbalancer:80
    keyword-matcher:
        image: ghcr.io/heussd/nats-news-analysis/keyword-matcher:latest
        restart: always
        depends_on:
            - nats-server
        deploy:
            replicas: 6
        environment:
            - NATS_URL=nats-server:4222
            - KEYWORDS_FILE_URL=${KEYWORDS_FILE_URL}
            - NATS_SUBSCRIBE_SUBJECT=news.*
            - NATS_CONSUMER=default
            - NATS_PUBLISH_SUBJECT=match-urls
    raindrop-integration:
        image: ghcr.io/heussd/nats-news-analysis/raindrop-integration:latest
        restart: always
        depends_on:
            - nats-server
        environment:
            - NATS_URL=nats-server:4222
            - NATS_SUBJECT=match-urls
            - RAINDROP_COLLECTION=${RAINDROP_COLLECTION}
            - RAINDROP_ACCESS_TOKEN=${RAINDROP_ACCESS_TOKEN}
    n-gram-analysis:
        image: ghcr.io/heussd/nats-news-analysis/n-gram-analysis:latest
        restart: always
        depends_on:
            - nats-server
        deploy:
            replicas: 0
        environment:
            - NATS_URL=nats-server:4222
            - NATS_SUBSCRIBE_SUBJECT=news.en
            - POSTGRES_HOST=${POSTGRES_HOST}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - PGSSLMODE=${PGSSLMODE}
    nats-indexer:
        image: ghcr.io/heussd/nats-news-analysis/nats-indexer:latest
        restart: always
        depends_on:
            - nats-server
        deploy:
            replicas: 1
        environment:
            - 'NATS_URL=nats-server:4222'
            - 'AI_SEARCH_ENDPOINT=${AI_SEARCH_ENDPOINT}'
            - 'AI_SEARCH_API_KEY=${AI_SEARCH_API_KEY}'
            - 'AI_SEARCH_API_VERSION=${AI_SEARCH_API_VERSION}'
    search-mcp-server:
        image: ghcr.io/heussd/nats-news-analysis/search-mcp-server:latest
        deploy:
            replicas: 0
        ports:
            - '8000:8000'
        environment:
            - 'AI_SEARCH_ENDPOINT=${AI_SEARCH_ENDPOINT}'
            - 'AI_SEARCH_API_KEY=${AI_SEARCH_API_KEY}'
            - 'AI_SEARCH_API_VERSION=${AI_SEARCH_API_VERSION}'
            - 'RAINDROP_RSS_FEED=${RAINDROP_RSS_FEED}'
    search-rest-server:
        image: ghcr.io/heussd/nats-news-analysis/search-rest-server:latest
        deploy:
            replicas: 0
        ports:
            - "8001:8000"
        environment:
            - 'AI_SEARCH_ENDPOINT=${AI_SEARCH_ENDPOINT}'
            - 'AI_SEARCH_API_KEY=${AI_SEARCH_API_KEY}'
            - 'AI_SEARCH_API_VERSION=${AI_SEARCH_API_VERSION}'
    loadbalancer:
        image: docker.io/nginx
        restart: always
        volumes:
            - "./loadbalancer/nginx.conf:/etc/nginx/nginx.conf"
        depends_on:
            - defuddle
        ports:
            - '8080:80'

    watchtower:
        image: docker.io/nickfedor/watchtower
        container_name: watchtower
        restart: unless-stopped
        volumes:
            - ${PODMAN_SOCKET:-/run/user/1000/podman/podman.sock}:/var/run/docker.sock # rootless podman socket; override PODMAN_SOCKET in .env
        command: --cleanup
