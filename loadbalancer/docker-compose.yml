services:
  defuddle:
    scale: 2
    image: ghcr.io/heussd/defuddle-server
    environment:
      ALLOW_PRIVATE_NETWORKS: "false"
    restart: always
   

  loadbalancer:
      image: nginx
      volumes:
        - "./nginx.conf:/etc/nginx/nginx.conf"
      depends_on:
          - defuddle
      ports:
          - '8080:80'

