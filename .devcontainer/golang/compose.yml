services:
  feed-feeder:
    profiles: [ "disabled" ]
  n-gram-analysis:
    profiles: [ "disabled" ]
  article-feeder:
    profiles: [ "disabled" ]
  news-feeder:
    profiles: [ "disabled" ]
  keyword-matcher:
    profiles: [ "disabled" ]
  raindrop-integration:
    profiles: [ "disabled" ]
  nats-indexer:
    profiles: [ "disabled" ]
  search-mcp-server:
    profiles: [ "disabled" ]
  search-rest-server:
    profiles: [ "disabled" ]
  devcontainer:
    build:
      context: ./golang/
      dockerfile: Dockerfile
      target: devcontainer
    environment:
      - NATS_URL=nats-server
      - DEFUDDLE_SERVER=http://loadbalancer:80
    env_file:
      - ./.env
    volumes:
      # Mounts the project folder to '/workspace'. While this file is in .devcontainer,
      # mounts are relative to the first file in the list, which is a level up.
      - .:/workspace:cached

    # [Optional] Required for ptrace-based debuggers like C++, Go, and Rust
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

    # Overrides default command so things don't shut down after the process ends.
    command: /bin/sh -c "while sleep 1000; do :; done"
